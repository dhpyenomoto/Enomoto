<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スライドパズル</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>スライドパズル</h1>
      <p class="subtitle">タイルを並べ替えて、左上から順番に揃えよう</p>
    </header>

    <section class="controls">
      <div class="control-group">
        <label for="size">サイズ</label>
        <select id="size">
          <option value="3">3 × 3</option>
          <option value="4" selected>4 × 4</option>
          <option value="5">5 × 5</option>
        </select>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">手数</span>
          <span class="stat-value" id="moves">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">タイム</span>
          <span class="stat-value" id="timer">00:00</span>
        </div>
      </div>

      <button id="shuffle" class="btn btn-primary">シャッフル</button>
    </section>

    <main class="board-wrap">
      <div id="board" class="board" aria-label="パズル盤面"></div>
      <div id="win" class="win-overlay hidden">
        <div class="win-card">
          <h2>クリア！🎉</h2>
          <p id="win-detail"></p>
          <button id="play-again" class="btn btn-primary">もう一度</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>クリックまたは矢印キーで、空きマスに隣接したタイルを動かせます。</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
